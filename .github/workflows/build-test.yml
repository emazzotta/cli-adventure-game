name: "Build & Test"

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-test:
    name: "Build & Test"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [8]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}

      - name: Build & Test
        run: mvn clean test
